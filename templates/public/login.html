{% extends 'public/base.html' %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-6">
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 border border-emerald-50">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold font-serif text-emerald-950 mb-2">Welcome Back</h2>
            <p class="text-emerald-700/60 text-sm">Login to access your orders and fast checkout.</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div class="space-y-1">
                <label class="block text-sm font-bold text-emerald-900 ml-1">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-emerald-400"></i>
                    <input type="email" name="email" required class="w-full bg-emerald-50/50 border border-emerald-100 rounded-2xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all outline-none" placeholder="farmer@example.com">
                </div>
            </div>
            
            <div class="space-y-1">
                <label class="block text-sm font-bold text-emerald-900 ml-1">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-emerald-400"></i>
                    <input type="password" name="password" required class="w-full bg-emerald-50/50 border border-emerald-100 rounded-2xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all outline-none" placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-2xl font-bold shadow-xl shadow-emerald-200 transition-all active:scale-95 mt-4">
                Login
            </button>
        </form>
        
        <div class="mt-8 text-center text-sm text-emerald-700/60">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="font-bold text-emerald-600 hover:text-emerald-500 hover:underline">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
